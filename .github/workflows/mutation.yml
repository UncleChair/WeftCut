name: mutation

# Mutation testing is a slow, PERIODIC quality gate — never a per-PR gate. It
# mutates the state mutation/validation code (validate.ts + the move/trim
# mutations, per stryker.config.mjs) and confirms the property-based test net
# actually KILLS the mutants. Runs weekly and on manual dispatch only. A drop
# below the break threshold (stryker.config.mjs `thresholds.break`) fails the
# run, surfacing a real coverage regression.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

# Read-only: this workflow builds + runs tests, never writes repo contents.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    # Mutation runs are long (a dry-run of the full suite + per-mutant covering
    # tests across hundreds of mutants); cap well under the 6h default.
    timeout-minutes: 60
    # OS-independent: the mutated code is pure-TS state logic. One leg (Linux) is
    # enough — Linux builds the napi addon fine (only standalone cargo TESTS fail
    # there, which this job doesn't run).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      # persist-credentials: false — nothing here talks to the remote after
      # checkout, so the token has no reason to stay in .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Stryker runs the vitest suite, which imports the napi addon
      # (@weftcut/core) and the wasm eval leaf — so both must be built first.
      # Action pins match electron-ci.yml (supply-chain hardening).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/native

      # npm ci at the workspace root: the root package-lock.json covers all
      # workspaces (there is no apps/desktop/package-lock.json). .npmrc sets
      # ignore-scripts=true, so no lifecycle script or pre/post hook runs here —
      # whatever the build needs is an explicit step below. No electron:install:
      # the vitest suite never loads Electron (see vitest.config.ts), so unlike
      # electron-ci this job needs no Electron binary.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build napi addon
        run: npm run napi:build

      # testSetup.ts loads the eval wasm before every test file. Its pretest hook
      # cannot deliver it twice over: hooks are off under ignore-scripts, and
      # `stryker run` drives vitest through its own runner rather than `npm test`
      # anyway. Build it explicitly.
      - name: Build wasm eval leaf
        run: npm run build:wasm

      # WEFTCUT_PBT_RUNS=30 shrinks the property-based tests' fast-check runs for
      # the mutation pass (every mutant re-runs its covering tests; fewer runs
      # keeps the matrix tractable while staying broad enough to kill mutants).
      # The mutation score (and the break threshold) live in stryker.config.mjs.
      - name: Mutation tests (Stryker)
        env:
          WEFTCUT_PBT_RUNS: '30'
        run: npm run pbt:stryker

      # Keep the HTML/JSON mutation report for inspection (gitignored locally,
      # uploaded here). if: always() so a threshold failure still publishes it.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          retention-days: 14
          path: apps/desktop/reports/mutation/**
