name: electron-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly full sweep: runs the @matrix tier that the per-PR e2e run drops
  # (what earns the tag: apps/desktop/e2e/README.md §Tiers). Same job, no
  # duplicated setup: only WEFTCUT_E2E_FULL differs (see the e2e step).
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  # Partial runs for CI iteration: pick one OS, scope the e2e suite (spec
  # files, -g filters, --full), skip packaging. Defaults reproduce a push run.
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner set'
        type: choice
        options: [all, windows-latest, ubuntu-latest, macos-latest]
        default: all
      e2e_args:
        description: 'Extra args forwarded to npm run e2e'
        type: string
        default: ''
      package:
        description: 'Run the unsigned packaging step'
        type: boolean
        default: true

# Least-privilege token: this workflow only reads the repo, builds, tests, and
# uploads artifacts (the artifact API uses its own runtime token) — it never
# writes repo contents, so read-only is enough.
permissions:
  contents: read

# Collapse redundant runs: a newer push to a branch/PR cancels the in-flight
# 3-OS matrix instead of stacking another full build + e2e + package.
# event_name is in the key so the nightly @matrix sweep and a same-ref push
# can never cancel each other — schedule/dispatch runs group only among
# themselves.
concurrency:
  # run_id for dispatch: partial runs of DIFFERENT parts must coexist, not
  # cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'ref' }}
  cancel-in-progress: true

jobs:
  build:
    # A wedged offscreen capture / Electron has hung before (the swiftshader
    # case); cap the job instead of letting it run to the 6h default. Sized to
    # the `all` e2e slice, NOT to the four split ones: a scoped dispatch can
    # still put the whole suite (`--full` included) on a single runner, and that
    # is the longest a green job can legitimately be. Headroom matters because a
    # leg that hits the cap reports only "exceeded the maximum execution time"
    # and hides which specs actually failed. Coverage cuts belong in the @matrix
    # tier (apps/desktop/e2e/README.md), not here.
    timeout-minutes: 90
    # Better Rust test logs in CI: full-colour cargo output + backtraces on panic.
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.os != 'all' && format('["{0}"]', inputs.os) || '["windows-latest", "ubuntu-latest", "macos-latest"]') }}
        # Which slice of the e2e suite this runner takes (see the E2E step for
        # the split and its measured cost). Every slice repeats the ~10 min
        # build above it, which is free here — public repo, and the rebuilds run
        # concurrently, so a build-once-then-fan-out job would only lengthen the
        # critical path by making that build serial.
        #
        # A scoped dispatch collapses to the single `all` slice: `e2e_args` names
        # its own specs, and running those args four times over is not a split.
        part: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.e2e_args != '' && '["all"]' || '["audio", "codecs", "overlap", "rest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      # persist-credentials: false — no job here pushes, fetches, or otherwise
      # talks to the remote after checkout (the one `git` call is a local
      # `git diff` in the catalog gate), so the token has no reason to sit in
      # .git/config where any later step or dependency script could read it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Resolved against the repo root, not this job's working-directory.
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # xvfb: the Electron app needs a display for offscreen CDP capture (no real
      # display on GitHub runners). libclang-dev: every bindgen build of
      # native-decode's ffmpeg-next needs libclang.so, and the `Rust tests` step
      # below runs one on every leg whatever the artifact cache did (clang-sys
      # auto-discovers it on Linux; only Windows hard-sets LIBCLANG_PATH).
      - name: Linux deps (xvfb, libclang)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libclang-dev

      # npm ci at the workspace root: root package-lock.json covers all
      # workspaces including apps/desktop. Running at apps/desktop would fail
      # because there is no apps/desktop/package-lock.json.
      #
      # The repo's .npmrc sets ignore-scripts=true, so this install runs no
      # lifecycle scripts at all. Anything an install would otherwise do
      # implicitly is an explicit step below.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      # Case in point: electron's own postinstall is what downloads
      # node_modules/electron/dist, and it never fires. The e2e suite launches
      # Electron through Playwright's `_electron` with no executablePath — it
      # resolves `require('electron')` — so skipping this fails the whole suite
      # at launch, long after everything else has gone green.
      - name: Install Electron binary
        run: npm run electron:install

      # Cache the fetched ffmpeg/ffprobe so repeat runs skip the CDN download —
      # ffmpeg:fetch no-ops when the binaries already exist. Keyed on the OS and
      # the fetch script (which pins FFMPEG_VERSION), so a version/source change
      # busts the cache. (path is repo-root-relative; cache ignores the job's
      # working-directory default.)
      - name: Cache ffmpeg
        uses: actions/cache@v6
        with:
          path: apps/desktop/resources/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('apps/desktop/scripts/fetch-ffmpeg.mjs') }}

      # Fetch the platform-appropriate static ffmpeg binary into
      # resources/ffmpeg/<os>/. This DRY script handles win/linux/mac and
      # exercises the Linux + macOS branches for the first time in CI.
      - name: Fetch ffmpeg
        run: npm run ffmpeg:fetch

      - name: Put bundled ffmpeg on PATH
        # CI runners have no system ffmpeg; the Rust integration tests + the
        # e2e app resolve "ffmpeg" via PATH. ffmpeg:fetch put it in resources/.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$PWD/resources/ffmpeg/win" >> "$GITHUB_PATH"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            echo "$PWD/resources/ffmpeg/linux" >> "$GITHUB_PATH"
          else
            echo "$PWD/resources/ffmpeg/mac" >> "$GITHUB_PATH"
          fi

      # ── @weftcut/native-decode (Windows + Linux + macOS) ───────────────────
      # All three OSes fetch their LGPL-shared ffmpeg asset and build the addon;
      # per-OS runtime resolution differs (see napi-build-decode.mjs).
      #
      # Split restore/save (not the combined actions/cache) because the combined
      # action's post-step does NOT save when the job later fails. macOS has no
      # prebuilt LGPL-shared asset and compiles ffmpeg from source (~10 min), so
      # under the combined action every red run threw that work away and the next
      # run paid for it again. Saving immediately after the fetch persists it
      # regardless of what a later step does.
      - name: Restore ffmpeg-lgpl cache
        id: cache-ffmpeg-lgpl
        uses: actions/cache/restore@v6
        with:
          path: apps/desktop/resources/ffmpeg-lgpl
          key: ffmpeg-lgpl-${{ runner.os }}-${{ hashFiles('apps/desktop/scripts/fetch-ffmpeg-lgpl.mjs') }}

      - name: Fetch LGPL ffmpeg (native-decode)
        run: npm run ffmpeg:fetch-lgpl

      - name: Save ffmpeg-lgpl cache
        if: steps.cache-ffmpeg-lgpl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: apps/desktop/resources/ffmpeg-lgpl
          key: ${{ steps.cache-ffmpeg-lgpl.outputs.cache-primary-key }}

      # Both addons, the conformance analyzer bin and the generated eval wasm —
      # restored from a cache keyed on the Rust sources, or built here and saved
      # (.github/actions/rust-artifacts owns the key and the per-artifact why).
      #
      # LANDMINE — must stay AFTER the LGPL fetch above: the decode addon's build
      # reads FFMPEG_DIR from resources/ffmpeg-lgpl/<os>.
      - uses: ./.github/actions/rust-artifacts

      - name: Put LGPL DLLs on PATH (native-decode runtime)
        if: runner.os == 'Windows'
        shell: bash
        run: cygpath -w "$PWD/resources/ffmpeg-lgpl/win/bin" >> "$GITHUB_PATH"

      # Typecheck + unit tests are OS-independent, so run them once, on the
      # Windows leg (it builds BOTH addons — native-decode's generated
      # index.d.ts is a typecheck input; the Linux leg builds decode too now, but
      # a single leg suffices). Neither was gated by CI before — the
      # esbuild build does no type-checking and vitest wasn't run at all — so
      # TS-type and unit regressions could slip through green. Placed after
      # both napi:build and napi:build:decode (needs their generated
      # .d.ts/.node) and before the heavier build/e2e/package so a failure
      # fails fast.
      - name: Typecheck (tsc -b)
        if: runner.os == 'Windows'
        run: npm run typecheck

      - name: Unit tests (vitest)
        if: runner.os == 'Windows'
        run: npm test

      # The build scripts' own node:test suite. Separate from `npm test` because
      # Vitest's `include` is pinned to the three src/ roots — these live in
      # apps/desktop/scripts/ and are a different runner, so nothing else picks
      # them up. They gate pure argv/env planning (E2E gate-flag splitting,
      # preflight wiring): fast, no build artifacts, OS-independent.
      - name: Build-script tests (node:test)
        if: runner.os == 'Windows'
        run: npm run test:scripts

      # The committed rust-native MCP catalog snapshot must equal what the addon
      # advertises. The bijection gate reconstructs the live catalog from this
      # fixture, so a stale fixture is the one drift the suite can't catch itself —
      # regenerate and diff. Needs only the napi addon (built above); the fixture is
      # pinned to LF via .gitattributes, so the diff is byte-clean on every leg. Run
      # once on the Windows leg alongside the other OS-independent checks.
      - name: MCP catalog snapshot up to date
        if: runner.os == 'Windows'
        shell: bash
        run: npm run mcp:catalog:check

      # Build the renderer + main bundles with the E2E hook compiled in.
      # build:e2e sets VITE_WEFTCUT_E2E itself, so this needs no bash shell for
      # an inline env-var prefix and cannot drift from what a developer runs —
      # run-e2e.mjs's preflight names this exact command when out/ is stale.
      - name: Build app (E2E mode)
        run: npm run build:e2e

      # The MAIN fixture matrix generates itself (playwright globalSetup →
      # ensureFixtures), but the two software-lane family gates read from the
      # separate decode-BENCH set, which nothing generates automatically — a
      # bench run is a local, opt-in measurement. Without these two files
      # preview-sw-families self-skipped on all three legs, so the ffmpeg
      # engine's software decode of an intra 4:2:2 (DNxHR) and a long-GOP
      # MPEG-2 source has never been gated anywhere but a dev machine (issue
      # #15 layer 1).
      #
      # Only the two rows those gates read: the full 12-row matrix is minutes
      # of encoding and ~10 GB, most of it for cells only the bench opens. Both
      # are full 60 s clips because the spec far-seeks to 50 s to strand the
      # ring before its backward-seek assertion — a shortened cut cannot
      # satisfy it. ~1.8 GB and ~1-2 min on a 4-vCPU runner.
      #
      # Deliberately NOT cached. At 1.8 GB × 3 legs it would take over half of
      # the repo's 10 GB cache budget for media that regenerates from a
      # committed script in a minute — and evict the two caches that cannot
      # (ffmpeg-lgpl on macOS is a ~10 min from-source build).
      - name: Generate software-lane family fixtures (e2e)
        working-directory: apps/desktop/e2e
        run: node scripts/gen-decode-bench-fixtures.mjs --only dnxhr-1080,mpeg2-1080

      # Rust unit tests.  No xvfb needed (headless library tests, no display).
      # Runs on ALL three OSes. The napi addon crate's `#[napi]` exports would
      # otherwise leave unresolved `napi_*` symbols in a standalone `cargo test`
      # binary (fatal on Linux, whose loader resolves imports at startup); the
      # `test-noop` feature — NAPI-RS's official Cargo-test mode — stubs those
      # wrappers so the domain logic links and runs identically on every runner.
      # This replaced the old Linux skip + macOS `-undefined dynamic_lookup` link
      # hack. test-noop is TEST-ONLY and must never enter napi:build's feature set.
      # See docs/notes/napi-rs-multiplatform-testing.md.
      - name: Rust tests
        shell: bash
        run: |
          # weftcut-eval is the shared-math leaf; the snap cross-language golden
          # lives here now (it moved off the napi crate). Pure Rust, no napi
          # linkage, so it tests standalone. (Its wasm build is gated separately
          # via the Linux `npm test` TS goldens, which run the same fixtures.)
          cargo test -p weftcut-eval --manifest-path native/Cargo.toml
          # The production feature union is the crate `default` (jobs/export/mcp/
          # speech — see native/Cargo.toml; motifs migrated to TS and is NOT a Cargo
          # feature). Features are additive, so `--features test-noop` = defaults +
          # test-noop, compiling every #[cfg(feature)] module PLUS the standalone-
          # binary symbol-resolution shim. No hand-kept feature list here — it
          # tracks Cargo.toml's default automatically. test-noop is test-only.
          cargo test --manifest-path native/Cargo.toml --lib --features test-noop
          # Component crate (native-decode): the repo's only ffmpeg-next consumer.
          # It needs FFMPEG_DIR + libclang to build and the bundled libav*.so/DLL
          # on the loader path at run (Windows: DLLs already on PATH above; Linux:
          # LD_LIBRARY_PATH below; macOS: DYLD_FALLBACK_LIBRARY_PATH — SIP strips
          # DYLD_* only for system-protected binaries, not user test binaries).
          # Its test-noop is ONLY napi/noop, NOT
          # napi-derive/noop (see decode/Cargo.toml) — enough to resolve the
          # standalone binary's napi_* symbols while keeping the ToNapiValue
          # derives its ThreadsafeFunction<ExportSwMsg> params require.
          if [ "$RUNNER_OS" = "Windows" ]; then
            FFMPEG_DIR="$(cygpath -m "$PWD")/resources/ffmpeg-lgpl/win" \
            LIBCLANG_PATH="C:\\Program Files\\LLVM\\bin" \
            cargo test --manifest-path native/decode/Cargo.toml --features test-noop
          elif [ "$RUNNER_OS" = "Linux" ]; then
            FFMPEG_DIR="$PWD/resources/ffmpeg-lgpl/linux" \
            LD_LIBRARY_PATH="$PWD/resources/ffmpeg-lgpl/linux/lib" \
            cargo test --manifest-path native/decode/Cargo.toml --features test-noop
          elif [ "$RUNNER_OS" = "macOS" ]; then
            FFMPEG_DIR="$PWD/resources/ffmpeg-lgpl/mac" \
            DYLD_FALLBACK_LIBRARY_PATH="$PWD/resources/ffmpeg-lgpl/mac/lib" \
            cargo test --manifest-path native/decode/Cargo.toml --features test-noop
          fi

      # Full e2e suite via Playwright — includes s6-determinism.spec.ts which
      # writes PNGs to determinism-artifacts/<process.platform>/ (win32/linux/darwin).
      #
      # RENDERER CHOICE: no forced --use-gl=swiftshader (it HANGS the offscreen
      # CDP capture on Windows 11). s6-determinism.spec.ts launches with each
      # OS's CI-default renderer; on Linux we wrap with xvfb-run -a for a virtual
      # framebuffer; Windows/macOS use the runner's native GPU stack. Captures
      # are byte-identical cross-OS regardless (see the threshold note on the
      # compare job) — no software-rendering force is needed.
      - name: E2E tests (includes determinism capture)
        shell: bash
        env:
          # The @matrix tier (see playwright.config.ts) runs only on the nightly
          # sweep — per-PR it would blow the job budget. A dispatch opts in by
          # passing --full in e2e_args instead of getting it implicitly.
          WEFTCUT_E2E_FULL: ${{ github.event_name == 'schedule' && '1' || '' }}
          # Dispatch runs are the scoped-diagnosis tool — tap the renderer
          # console so a wedge reports its last milestone in the job log.
          WEFTCUT_E2E_CONSOLE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # The GPU-less legs (Linux AND Windows) rasterize in software, whose
          # shader rounding shifts smooth regions by ±1-2 LSB — SSIM-visible,
          # PSNR-flat. Both legs measure ~0.67 healthy; floors calibrated to
          # that baseline, and the color gates' per-channel ceiling likewise
          # (worst measured 12/255). See e2e/README.md §SSIM floors.
          WEFTCUT_E2E_SSIM_FLOOR: ${{ matrix.os != 'macos-latest' && '0.62' || '' }}
          WEFTCUT_E2E_COLOR_FAITHFUL_MAX: ${{ matrix.os != 'macos-latest' && '16' || '' }}
          E2E_ARGS: ${{ inputs.e2e_args }}
          PART: ${{ matrix.part }}
        run: |
          # THE SPLIT lives in e2e/slices.mjs — one home, read here per runner,
          # by scripts/e2e-split.test.mjs (the gate against a spec that lands on
          # no runner at all), and by `npm run e2e -- --slice=<name>` for
          # replaying a red slice locally. Slices are named by the files whose
          # cost is structural (the export matrices) and the catch-all takes
          # everything they do not, so a new spec needs no entry anywhere.
          # Rebalance from the e2e-timings-* artifacts when a slice drifts;
          # playwright.config.ts (§WEFTCUT_E2E_ONLY) carries why this is not
          # Playwright's own --shard.
          e2e() {
            if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run e2e -- "$@"; else npm run e2e -- "$@"; fi
          }
          # `all` is the scoped-dispatch path: unsplit, and run-e2e.mjs's own
          # serial-then-parallel plan rather than this step's, with e2e_args
          # forwarded verbatim (unquoted — it is a word list, not one argument).
          if [ "$PART" = "all" ]; then
            e2e $E2E_ARGS
          else
            # Through a variable rather than `eval "$(...)"` directly: `set -e`
            # fails a failed ASSIGNMENT but not a failed substitution inside
            # eval, and an unknown PART must be a red leg — never an empty
            # restriction under which this one runner repeats the whole suite.
            SLICE_ENV="$(node e2e/slices.mjs --shell "$PART")"
            eval "$SLICE_ENV"
            # The serial project owns the machine and captures the determinism
            # PNGs, so it runs on exactly ONE slice — the one slices.mjs marks
            # `serial: true`, kept off whichever slice is already the worst case.
            # The determinism upload below must name that same slice.
            if [ "$PART" = "codecs" ]; then e2e --project=serial; fi
            # LANDMINE — the slice restriction rides the parallel invocation and
            # nothing else, which is what the subshell enforces. Exported above
            # the serial run instead, or written to $GITHUB_ENV, it narrows the
            # serial project to the sliced files as well; no @serial test lives
            # in any of them, and Playwright kills the leg with "No tests found".
            # The serial project is not sliced at all — it greps @serial across
            # the whole suite.
            ( export WEFTCUT_E2E_ONLY="$OWN" WEFTCUT_E2E_IGNORE="$IGN"; e2e --project=parallel )
          fi

      # Upload determinism PNGs so the compare job can fetch all three OSes.
      # if: always() so a partial capture or test failure still uploads whatever
      # PNGs were written — essential for diagnosing the first run.
      #
      # Gated to the slice that runs the serial project, and the NAME stays
      # unsliced: the compare job reads `determinism-<os>` by literal path. Two
      # slices uploading under one name is a hard artifact conflict, so this
      # condition and the serial project's slice above must name the same one.
      - name: Upload determinism artifacts
        if: always() && (matrix.part == 'codecs' || matrix.part == 'all')
        uses: actions/upload-artifact@v7
        with:
          name: determinism-${{ matrix.os }}
          retention-days: 14
          # process.platform values: win32 / linux / darwin
          path: apps/desktop/determinism-artifacts/**

      # Upload Playwright traces/reports for any failing specs.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.part }}
          retention-days: 14
          path: apps/desktop/test-results/**

      # Per-test durations for the run, one JSON per project (playwright.config.ts
      # §reporter). Its own artifact rather than a path added to test-results-*
      # above: that one is empty on a green run, and a green run is exactly when
      # these timings are worth reading. if: always() so a red or timed-out leg —
      # the case that motivates looking at cost at all — still publishes them.
      #
      # One per slice, and the whole set is what rebalances the split: the E2E
      # step's slice boundaries were measured from exactly these files.
      - name: Upload e2e timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-${{ matrix.os }}-${{ matrix.part }}
          retention-days: 14
          path: apps/desktop/e2e-report/**

      # Sign-free packaging. Deliberately NOT `npm run package`: that script
      # re-runs napi:build + napi:build:decode for a one-shot local package,
      # and both addons already built above (their .node artefacts persist in
      # node_modules/@weftcut/{core,native-decode}). Run the two remaining
      # halves directly — `build` for a clean non-E2E renderer bundle (no
      # VITE_WEFTCUT_E2E), then electron-builder.
      #
      # Once per OS, not once per e2e slice — and on `overlap`, the lightest
      # slice, for the same reason the serial project rides `codecs`: neither
      # extra should land on whichever slice is already the worst case.
      - name: Package (unsigned)
        if: (github.event_name != 'workflow_dispatch' || inputs.package) && (matrix.part == 'overlap' || matrix.part == 'all')
        run: npm run build && npx electron-builder --publish never

      # Packaging is VERIFIED on every push by "Package (unsigned)" above; this
      # step only PERSISTS the resulting installer. Installers are large
      # (~0.4–0.9 GB per OS) and nothing downstream consumes them (the compare
      # job only needs determinism-*). Uploading ~2 GB on every push refills the
      # account artifact-storage quota, which then fails the essential (tiny)
      # determinism-* upload and reddens the whole matrix. So only keep an
      # installer when explicitly wanted — a tag build or a manual dispatch —
      # with short retention on top.
      - name: Upload installer
        if: success() && (matrix.part == 'overlap' || matrix.part == 'all') && ((github.event_name == 'workflow_dispatch' && inputs.package) || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          retention-days: 5
          path: apps/desktop/release/*

  # Cross-OS SSIM comparison.  Runs after every build job finishes — one per
  # (os, e2e slice) pair — but only the slice carrying the serial project
  # publishes a determinism-* artifact for it to read (fail-fast: false means
  # they all attempt even if one fails).
  compare:
    needs: build
    # A partial dispatch (one OS or a scoped suite) cannot feed a 3-way compare.
    if: github.event_name != 'workflow_dispatch' || (inputs.os == 'all' && inputs.e2e_args == '')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # This job only runs the pure-JS SSIM comparator, so the install exists
      # solely for pngjs — no addon, no wasm, no electron binary needed.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      # Download all three per-OS determinism artifact bundles into dl/.
      # The upload paths are apps/desktop/determinism-artifacts/<platform>/,
      # which get stored by upload-artifact v7 without the leading path prefix;
      # each artifact name is determinism-<os>  (e.g. determinism-windows-latest).
      # After download-artifact v8 with merge-multiple: false, the layout is:
      #   dl/determinism-windows-latest/<platform>/...
      #   dl/determinism-ubuntu-latest/<platform>/...
      #   dl/determinism-macos-latest/<platform>/...
      # where <platform> is win32, linux, darwin from process.platform.
      - uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          path: apps/desktop/dl
          merge-multiple: false

      # THRESHOLD NOTE (Task 8, CI run #13 GREEN):
      # Tuned to 0.98 from the measured byte-identical result (SSIM = 1.0000
      # across all cross-OS pairs win/linux, win/darwin, linux/darwin for the
      # positive motif captures countdown + lower-third).  No forced SwiftShader
      # was used — each OS uses its CI-default renderer under xvfb (Linux); the
      # captures are still byte-identical, exceeding the perceptual expectation.
      # Negative control diverges to ≤ 0.1566, proving the gate's teeth.
      # 0.98 leaves headroom for future minor cross-OS drift while still
      # catching real divergence (NEG floor ~0.16 is far below 0.98).
      - name: Cross-OS SSIM compare
        run: |
          node e2e/lib/compare-determinism.mjs \
            dl/determinism-windows-latest/win32 \
            dl/determinism-ubuntu-latest/linux \
            dl/determinism-macos-latest/darwin \
            --threshold 0.98
