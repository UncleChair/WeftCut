[package]
name = "poc_native"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imbl = { version = "3", features = ["serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[build-dependencies]
napi-build = "2"
