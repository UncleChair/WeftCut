# @weftcut/native-decode — the optional native preview-decode component
# (ADR 0030 §Conditional first-class). Carries preview_sw +
# preview_gpu and the ONLY ffmpeg-next linkage in the repo; @weftcut/core
# must never link libav. Build needs FFMPEG_DIR (shared build with
# include/ + lib/) and LIBCLANG_PATH; run needs the matching DLLs on PATH.
[package]
name = "weftcut-native-decode"
version = "0.0.0"
edition = "2021"
description = "WeftCut native decode component"
license = "MIT"
authors = ["WeftCut"]
publish = false
rust-version = "1.77"

[lib]
name = "weftcut_native_decode"
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"

[dependencies]
# `dyn-symbols` is a NAPI-RS v3 DEFAULT (see @weftcut/core's Cargo.toml): the
# component addon resolves the host's `napi_*` entry points via dynamic lookup at
# load time instead of baking them in as hard import records. Same production
# symbol-resolution policy as the core addon — keep the two in lockstep.
# See docs/notes/napi-rs-multiplatform-testing.md.
napi = { version = "3", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "3"
serde_json = "1"
tracing = "0.1"
ffmpeg-next = "8.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  # Fxc: runtime D3DCompile for the preview_gpu NV12→RGBA conversion shader
  # (color-sovereign HW lane — the shader is compiled once per session with the
  # session's matrix/range constants baked in as #defines).
  "Win32_Graphics_Direct3D_Fxc",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# test-noop: NAPI-RS's Cargo-test mode (TEST-ONLY, never in napi:build:decode).
# It stubs the runtime napi_* symbols so decode's #[napi] exports don't leave
# unresolved symbols in a standalone `cargo test` binary (fatal on Linux, whose
# loader resolves imports at startup), letting the preview_sw / preview_gpu /
# export_sw unit tests link and run on Linux (and macOS once its ffmpeg-lgpl
# asset lands) as well as Windows.
#
# NOTE: unlike @weftcut/core this enables ONLY `napi/noop`, NOT
# `napi-derive/noop`. decode holds `ThreadsafeFunction<ExportSwMsg>` /
# `ThreadsafeFunction<String>` in non-test code; `napi-derive/noop` would delete
# the derived `ToNapiValue` impl for the `#[napi(object)]` `ExportSwMsg` that the
# ThreadsafeFunction bound requires, breaking compilation. Keeping napi-derive
# active preserves those impls while napi/noop still fixes the linker symbols.
# See docs/notes/napi-rs-multiplatform-testing.md.
test-noop = ["napi/noop"]
