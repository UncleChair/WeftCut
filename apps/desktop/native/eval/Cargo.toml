[package]
name = "weftcut-eval"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
# (none yet — libm lands in the db_to_linear task. No serde/schemars: the only
# serde/schemars-carrying type, `Rational`, stays in the napi crate.)

# Test-only: the cross-language golden tests deserialize the shared fixtures.
# Not part of the shipped native/wasm artifact.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
