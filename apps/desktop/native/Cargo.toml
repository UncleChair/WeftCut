# The napi crate is the workspace root; members: the dependency-light
# `weftcut-eval` leaf (native + wasm32) and the optional `weftcut-native-decode`
# component addon (the only ffmpeg-next consumer — see decode/Cargo.toml).
[workspace]
members = ["eval", "decode"]

[package]
name = "weftcut"
version = "0.0.0"
edition = "2021"
description = "WeftCut desktop app"
authors = ["WeftCut"]
publish = false
rust-version = "1.77"

[lib]
name = "weftcut_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
napi-build = "2"

[dependencies]
# Shared "WYSIWYG math" leaf (snap algorithm, keyframe eval, envelope, role
# gate). One source of truth; the renderer consumes the same crate compiled to
# wasm32. `serde` gives the leaf's `Interpolation` its wire shape so the napi
# `Keyframe<T>` stays Serialize/Deserialize. `Rational` (which also needs
# schemars, forbidden in the leaf) stays in state/time.rs.
weftcut-eval = { path = "eval", features = ["serde"] }

# napi-rs: WeftCut's domain core is exposed to Electron as a native addon.
# `dyn-symbols` is a NAPI-RS v3 DEFAULT: the addon resolves the host's `napi_*`
# entry points via dynamic lookup at load time rather than baking them in as hard
# import records. It was dropped when defaults were switched off (2026-06-17)
# without recording that direct symbol linking was intentional; restoring it
# realigns the production addon with upstream guidance. It is a production
# symbol-resolution policy, NOT a test shim — see the `test-noop` feature below
# and docs/notes/napi-rs-multiplatform-testing.md.
napi = { version = "3", default-features = false, features = ["napi6", "tokio_rt", "dyn-symbols"] }
napi-derive = "3"

# Async + serialization
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# Domain primitives
imbl = { version = "3", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
parking_lot = "0.12"
# Workspace copies land under NFC-normalized names (jobs/import.rs): macOS
# hands out NFD filenames, and an NFD name that survives a byte-preserving
# transfer looks identical to the recorded NFC path_rel yet never matches it.
unicode-normalization = "0.1"

# Errors / logs
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `regex` is used by the status/log redactor (`logs::redact`) to strip
# api-key/bearer-token patterns from `details` payloads.
regex = "1"

# --- Phase 0 spike deps. Pin/upgrade once verified to compile. ---
ffmpeg-sidecar = "2"
# S4a: the MCP core is transport-free (the HTTP/streamable server lives in the
# Electron main process; see `src/mcp/` + `docs/mcp.md`). rmcp/axum/tokio-stream/
# futures are gone — the old SSE transport + axum change-feed were deleted in the
# napi migration. The wire types in `src/mcp/wire.rs` serialize to the exact JSON
# the `@modelcontextprotocol/sdk` low-level Server expects.
# Phase 1.x Stage 6 base64-encodes media bytes (JPG thumbnails, peaks file)
# into the media://* resources' blob field. Pinning for direct use.
base64 = "0.22"
# HTTP client for Whisper / Deepgram / future cloud providers. Pin rustls
# explicitly to avoid pulling in a native-tls stack (single TLS backend).
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
# Phase 6 Stage 4 cloud-provider traits (`Transcriber`, `Synthesizer`) need
# `dyn`-compatible async methods. Native async-fn-in-trait isn't dyn-safe yet
# on stable; `async-trait` is the standard workaround and keeps the
# "add Deepgram in a single file" exit criterion clean.
async-trait = "0.1"
# Export/conformance helpers use temp files for streamed media slices and
# decoded-frame probes. RAII drop on `NamedTempFile` cleans temps automatically.
# Already a dev-dep; promoted to production.
tempfile = "3"
# P10b: `commands::compare_fixture_frame` SSIM-compares an actual PNG
# (from `extract_video_frame`) against a committed baseline. We use
# `image-compare`'s `rgb_similarity_structure` with `MSSIMSimple` —
# returns a score in [0, 1] where 1.0 is pixel-identical. License is
# MIT (`dssim-core`'s AGPL-3.0 is incompatible with what this app may
# eventually ship under, so we pick the friendlier alternative even
# though the algorithm is the same family). `image` (MIT/Apache-2.0)
# decodes the PNG bytes; both libs together add ~150 KB to the binary.
image = { version = "0.25", default-features = false, features = ["png"] }
image-compare = "0.5"

[dev-dependencies]
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1"

[features]
default = []
# Deferred subsystems — OFF in S2, each turned on in its own stage.
jobs = []        # import/proxy/conform/thumbnails/waveform + io::probe + ffmpeg (S3)
export = ["jobs"]  # video export + IPC videosink (S3); needs jobs for enqueue_conform/io::probe
cloud = ["jobs"]  # transcription/TTS (S4b); needs jobs for audio_extract's ffmpeg_sem
mcp = []         # MCP server (S4)

# test-noop: NAPI-RS's official Cargo-test compilation mode (TEST-ONLY, never in
# `napi:build`). A `cargo test` binary is a standalone executable, not a
# Node/Electron host, so the `#[napi]` exports' direct `napi_*` imports have no
# provider — fatal on Linux, whose loader resolves imports at startup. Enabling
# `napi/noop` + `napi-derive/noop` stubs those wrappers to no-ops so the domain
# logic under them links and runs identically on all three runners, replacing the
# old Linux skip + macOS `-undefined dynamic_lookup` link hack. Exported wrappers
# vanish under noop, so this also produces expected `dead_code` warnings.
# See docs/notes/napi-rs-multiplatform-testing.md.
test-noop = ["napi/noop", "napi-derive/noop"]

# opt-level 1 keeps dev-build transport throughput honest; release was never affected.
# (see memory feedback_rust_optlevel_monomorphization: generics monomorphize at the caller's opt-level).
[profile.dev]
opt-level = 1

# Dependencies build without debug info in dev. Their .pdb files dominated
# target/debug (measured ~194 GB, almost entirely dependency debug info).
# `package."*"` applies to dependencies only, so weftcut/weftcut_lib keep the
# [profile.dev] defaults above and stay fully debuggable (line/var backtraces).
[profile.dev.package."*"]
debug = false
