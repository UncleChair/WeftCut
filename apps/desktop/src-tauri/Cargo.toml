[package]
name = "weftcut"
version = "0.0.0"
edition = "2021"
description = "WeftCut desktop app"
authors = ["WeftCut"]
publish = false
rust-version = "1.77"
default-run = "weftcut"

[lib]
name = "weftcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "weftcut"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri shell
tauri = { version = "2", features = ["webview-data-url", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
# Dev-only: drives the running webview from the tauri-mcp-server for in-app
# testing. Registered behind `#[cfg(debug_assertions)]` in lib.rs so it never
# activates in release builds.
tauri-plugin-mcp-bridge = "0.11"

# Async + serialization
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
ts-rs = { version = "12", features = ["uuid-impl", "chrono-impl"] }

# Domain primitives
imbl = { version = "3", features = ["serde"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
parking_lot = "0.12"

# Errors / logs
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `regex` is used by the status/log redactor (`logs::redact`) to strip
# api-key/bearer-token patterns from `details` payloads. It's already in
# the build graph transitively via `tauri-plugin-shell` / `tauri-utils`,
# so adding it as a direct dep is essentially free.
regex = "1"

# --- Phase 0 spike deps. Pin/upgrade once verified to compile. ---
ffmpeg-sidecar = "2"
# Anthropic Rust MCP SDK. Pinned to 0.1.x: 1.x dropped the
# `transport-sse-server` feature in favor of streamable-HTTP only. Our
# `mcp/mod.rs::serve` uses `rmcp::transport::sse_server::SseServer`,
# which is gone in 1.x. Migrating means swapping the server type AND
# verifying every connecting client (Claude Desktop, Cursor, custom
# integrations) speaks streamable-HTTP. Tracked as separate work; see
# [[feedback_rmcp_migration_blocked]].
rmcp = { version = "0.1", features = ["server", "macros", "transport-sse-server"] }
# Phase 4 Stage 5 ships an MCP-side change-feed on a separate /events SSE
# endpoint so it doesn't compete with rmcp's notification surface (which
# 0.1.x doesn't expose anyway). Both crates land via rmcp's transitive
# dependency tree; pinning here so we can use them directly.
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
# Phase 1.x Stage 6 base64-encodes media bytes (JPG thumbnails, peaks file)
# into rmcp's BlobResourceContents.blob String field for the media://*
# resources. Already transitively present via tauri/rmcp; pinning for direct
# use.
base64 = "0.22"
# Phase 6 cloud transcription stores per-provider API keys in the OS native
# keyring (Windows Credential Manager, macOS Keychain, Linux Secret Service).
# Linux needs a Secret-Service daemon at runtime — fine for desktop, gate
# tests behind a flag if CI ever lands.
# keyring 4 split into a router (`keyring` + `keyring-core`) with explicit
# store selection (`use_named_store`). Migration is a real piece of work,
# not a casual bump — keep `keyring = "3"` until that's scoped.
keyring = "3"
# HTTP client for Whisper / Deepgram / future cloud providers. Pinning rustls
# features explicitly avoids pulling in a second native-tls stack alongside
# the one tauri already brings in via its plugin transitives.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
# Phase 6 Stage 4 cloud-provider traits (`Transcriber`, `Synthesizer`) need
# `dyn`-compatible async methods. Native async-fn-in-trait isn't dyn-safe yet
# on stable; `async-trait` is the standard workaround and keeps the
# "add Deepgram in a single file" exit criterion clean.
async-trait = "0.1"
# P10a: `commands::extract_video_frame` writes the JS-side MP4 bytes to
# disk so ffmpeg can seek into it. RAII drop on `NamedTempFile` cleans
# both temps automatically. Already a dev-dep; promoted to production.
tempfile = "3"
# P10b: `commands::compare_fixture_frame` SSIM-compares an actual PNG
# (from `extract_video_frame`) against a committed baseline. We use
# `image-compare`'s `rgb_similarity_structure` with `MSSIMSimple` —
# returns a score in [0, 1] where 1.0 is pixel-identical. License is
# MIT (`dssim-core`'s AGPL-3.0 is incompatible with what this app may
# eventually ship under, so we pick the friendlier alternative even
# though the algorithm is the same family). `image` (MIT/Apache-2.0)
# decodes the PNG bytes; both libs together add ~150 KB to the binary.
image = { version = "0.25", default-features = false, features = ["png"] }
image-compare = "0.5"
# Dev-only system-resource sampler (`sysmon.rs`) for the PerfHUD: per-process
# CPU% + RSS of the app's WebView2 process tree. Only the `system` feature is
# needed (cpu/memory/process); disk/network/component/user are off. Used solely
# behind `#[cfg(debug_assertions)]`, so it never runs in release (the crate
# still compiles into the binary — a small, accepted cost for a dev tool).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
insta = { version = "1", features = ["json", "yaml"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
