[package]
name = "weftcut"
version = "0.0.0"
edition = "2021"
description = "WeftCut desktop app"
authors = ["WeftCut"]
publish = false
rust-version = "1.77"

[lib]
name = "weftcut_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
napi-build = "2"

[dependencies]
# napi-rs: WeftCut's domain core is exposed to Electron as a native addon.
napi = { version = "3", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "3"

# Async + serialization
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
ts-rs = { version = "12", features = ["uuid-impl", "chrono-impl"] }

# Domain primitives
imbl = { version = "3", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
parking_lot = "0.12"
# Stage-5 Motif hot-reload: watches `<app_config_dir>/motifs/` and coalesces
# disk changes into `motifs:changed` (src/motifs/watcher.rs).
notify = "8"

# Errors / logs
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `regex` is used by the status/log redactor (`logs::redact`) to strip
# api-key/bearer-token patterns from `details` payloads. It's already in
# the build graph transitively via `tauri-plugin-shell` / `tauri-utils`,
# so adding it as a direct dep is essentially free.
regex = "1"

# --- Phase 0 spike deps. Pin/upgrade once verified to compile. ---
ffmpeg-sidecar = "2"
# S4a: the MCP core is transport-free (the HTTP/streamable server lives in the
# Electron main process; see `src/mcp/` + `docs/mcp.md`). rmcp/axum/tokio-stream/
# futures are gone — the old SSE transport + axum change-feed were deleted in the
# napi migration. The wire types in `src/mcp/wire.rs` serialize to the exact JSON
# the `@modelcontextprotocol/sdk` low-level Server expects.
# Phase 1.x Stage 6 base64-encodes media bytes (JPG thumbnails, peaks file)
# into the media://* resources' blob field. Pinning for direct use.
base64 = "0.22"
# HTTP client for Whisper / Deepgram / future cloud providers. Pinning rustls
# features explicitly avoids pulling in a second native-tls stack alongside
# the one tauri already brings in via its plugin transitives.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
# Phase 6 Stage 4 cloud-provider traits (`Transcriber`, `Synthesizer`) need
# `dyn`-compatible async methods. Native async-fn-in-trait isn't dyn-safe yet
# on stable; `async-trait` is the standard workaround and keeps the
# "add Deepgram in a single file" exit criterion clean.
async-trait = "0.1"
# Export/conformance helpers use temp files for streamed media slices and
# decoded-frame probes. RAII drop on `NamedTempFile` cleans temps automatically.
# Already a dev-dep; promoted to production.
tempfile = "3"
# Task 1 (10-bit export): loopback WebSocket transport — webview streams raw
# yuv420p10le frames into the Rust video sink for ffmpeg encode.
tungstenite = "0.24"
# P10b: `commands::compare_fixture_frame` SSIM-compares an actual PNG
# (from `extract_video_frame`) against a committed baseline. We use
# `image-compare`'s `rgb_similarity_structure` with `MSSIMSimple` —
# returns a score in [0, 1] where 1.0 is pixel-identical. License is
# MIT (`dssim-core`'s AGPL-3.0 is incompatible with what this app may
# eventually ship under, so we pick the friendlier alternative even
# though the algorithm is the same family). `image` (MIT/Apache-2.0)
# decodes the PNG bytes; both libs together add ~150 KB to the binary.
image = { version = "0.25", default-features = false, features = ["png"] }
image-compare = "0.5"
# Dev-only system-resource sampler (`sysmon.rs`) for the PerfHUD: per-process
# CPU% + RSS of the app's WebView2 process tree. Only the `system` feature is
# needed (cpu/memory/process); disk/network/component/user are off. Used solely
# behind `#[cfg(debug_assertions)]`, so it never runs in release (the crate
# still compiles into the binary — a small, accepted cost for a dev tool).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# --- Motifs (web-page → video-frame capture) ---
# Windows-only. The capture path drives the WebView2 DevTools Protocol
# (`Emulation.setDeviceMetricsOverride` + `Page.captureScreenshot`) from Rust
# via `CallDevToolsProtocolMethod`. `webview2-com` 0.38 / `windows` 0.61 are
# already in Tauri's (wry's) dependency graph on Windows, so adding them as
# direct deps reuses the already-compiled artifacts rather than pulling a new
# version. See `apps/desktop/src-tauri/src/motifs/cdp.rs`.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Win32_System_Com: CoTaskMemFree for the PWSTRs returned by
# ICoreWebView2File::Path (media_drop).
windows = { version = "0.61", features = ["Win32_System_Com"] }

[dev-dependencies]
insta = { version = "1", features = ["json", "yaml"] }

[features]
default = []
# Deferred subsystems — OFF in S2, each turned on in its own stage.
jobs = []        # import/proxy/conform/thumbnails/waveform + io::probe + ffmpeg (S3)
export = ["jobs"]  # video export + WS videosink (S3); needs jobs for enqueue_conform/io::probe
cloud = ["jobs"]  # transcription/TTS (S4b); needs jobs for audio_extract's ffmpeg_sem
mcp = []         # MCP server (S4)
motifs = []      # Motif capture (S5)
media_drop = []  # webview drag-drop path recovery (S3)
sysmon = []      # dev PerfHUD sampler

# The 10-bit export's WS video sink (export/videosink.rs) reads ~6 MB/frame
# through tungstenite; at opt-level 0 its read loop tops out at ~107 MB/s on
# loopback (measured), capping dev-build 10-bit exports at ~71 MB/s end-to-end
# — well under the ~190 MB/s a 1080p30 yuv420p10le stream needs. At opt-level
# 1 the same loop sustains ~340 MB/s and the webview→Rust transport reaches
# ~312 MB/s (the webview send path becomes the ceiling). A per-package
# override on tungstenite does NOT work: the entire read path is generic over
# the stream and monomorphizes into THIS crate at THIS crate's opt-level. So
# the whole dev profile runs at opt-level 1 — release builds were never
# affected; this keeps dev/e2e (--debug) transport honest.
[profile.dev]
opt-level = 1

# Dependencies build without debug info in dev. Their .pdb files dominated
# target/debug (measured ~194 GB, almost entirely dependency debug info).
# `package."*"` applies to dependencies only, so weftcut/weftcut_lib keep the
# [profile.dev] defaults above and stay fully debuggable (line/var backtraces).
[profile.dev.package."*"]
debug = false
