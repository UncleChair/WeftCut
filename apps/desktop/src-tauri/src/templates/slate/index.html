<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <div class="bg"></div>
  <div class="frame">
    <div class="clapper">
      <div class="stripe" style="background: #fff"></div>
      <div class="stripe" style="background: #111"></div>
      <div class="stripe" style="background: #fff"></div>
      <div class="stripe" style="background: #111"></div>
      <div class="stripe" style="background: #fff"></div>
      <div class="stripe" style="background: #111"></div>
    </div>
    <div id="project" class="project">Project</div>
    <div class="subhead">Production Slate</div>
    <div class="grid">
      <div class="cell"><span class="key">Scene</span><span id="scene" class="value"></span></div>
      <div class="cell"><span class="key">Take</span><span id="take" class="value"></span></div>
      <div class="cell"><span class="key">Camera</span><span id="camera" class="value"></span></div>
      <div class="cell"><span class="key">Director</span><span id="director" class="value"></span></div>
      <div class="cell"><span class="key">Date</span><span id="date" class="value"></span></div>
    </div>
  </div>
  <div id="flash" class="flash"></div>
  <script>
    // Production slate. The clapper stripes are static; the white-flash
    // overlay simulates the clap at t=0 and fades out over the first ~0.25s
    // so a 30fps render captures the flash on frame 0 and the clean board
    // from frame ~8 onward.
    async function start() {
      while (!window.__props__) {
        await new Promise((r) => setTimeout(r, 5));
      }
      const p = window.__props__;
      document.getElementById('project').textContent = p.project || '';
      document.getElementById('scene').textContent = p.scene || '';
      document.getElementById('take').textContent = p.take || '';
      document.getElementById('camera').textContent = p.camera || '';
      document.getElementById('director').textContent = p.director || '';
      document.getElementById('date').textContent = p.date || '';
      const flash = document.getElementById('flash');

      const FLASH_DURATION = 0.25;
      function tick() {
        const t = performance.now() / 1000;
        const u = Math.max(0, Math.min(1, t / FLASH_DURATION));
        flash.style.opacity = (1 - u).toFixed(3);
        requestAnimationFrame(tick);
      }
      tick();

      window.__ready__ = Promise.resolve();
    }
    start();
  </script>
</body>
</html>
