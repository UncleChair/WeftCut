<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>f16 filter-pool parity gate</title></head>
  <body>
    <script>
      // Renderer side of the f16 filter-pool parity gate.
      //
      // Env var POOL_F16=1  → bump TexturePool to rgba16float before init
      // Env var POOL_F16=0  → leave default (8-bit pool)
      //
      // Builds a 1024-step rgba16float gradient, runs it through a BlurFilter,
      // reads back float pixels, and reports distinct-value counts via IPC.
      //
      // Validated technique: set TexturePool.textureOptions.format once at init,
      // before any FilterSystem allocates intermediates. Never call
      // TexturePool.clear(true) on a live FilterSystem — it destroys pooled
      // textures that persistent filter bind groups still reference (null crash).
      const { ipcRenderer } = require("electron");
      const F16 = process.env.POOL_F16 === "1";

      function halfToFloat(h) {
        const s = (h & 0x8000) >> 15, e = (h & 0x7c00) >> 10, f = h & 0x03ff;
        if (e === 0) return (s ? -1 : 1) * Math.pow(2, -14) * (f / 1024);
        if (e === 0x1f) return f ? NaN : (s ? -1 : 1) * Infinity;
        return (s ? -1 : 1) * Math.pow(2, e - 15) * (1 + f / 1024);
      }

      (async () => {
        const out = { condition: F16 ? "f16-pool" : "default-pool", phases: {} };
        const phase = (name, fn) => {
          try { out.phases[name] = fn(); } catch (e) { out.phases[name] = { error: String((e && e.stack) || e) }; }
        };
        try {
          const PIXI = require("pixi.js");
          const { autoDetectRenderer, RenderTexture, Sprite, Mesh, MeshGeometry,
            Shader, BlurFilter, ColorMatrixFilter, TexturePool, Container } = PIXI;

          // Pool-bump: must happen before autoDetectRenderer so the FilterSystem
          // never sees an empty-pool miss that materialises as bgra8unorm.
          if (F16) {
            TexturePool.textureOptions = { ...TexturePool.textureOptions, format: "rgba16float" };
          }

          const W = 1024, H = 4;
          const renderer = await autoDetectRenderer({ preference: "webgl", width: W, height: H, antialias: false });
          const gl = renderer.gl;
          out.diag = {
            pixi: PIXI.VERSION,
            glRenderer: gl.getParameter(gl.RENDERER),
            colorBufferFloat: !!gl.getExtension("EXT_color_buffer_float"),
          };

          // The middle row of a render target, red channel only.
          function readRedRow(rt) {
            renderer.renderTarget.bind(rt, false);
            const type = gl.getParameter(gl.IMPLEMENTATION_COLOR_READ_TYPE);
            const y = H >> 1, reds = [];
            if (type === gl.FLOAT) {
              const buf = new Float32Array(W * 4);
              gl.readPixels(0, y, W, 1, gl.RGBA, gl.FLOAT, buf);
              for (let i = 0; i < W; i++) reds.push(buf[i * 4]);
            } else {
              const buf = new Uint16Array(W * 4);
              gl.readPixels(0, y, W, 1, gl.RGBA, gl.HALF_FLOAT, buf);
              for (let i = 0; i < W; i++) reds.push(halfToFloat(buf[i * 4]));
            }
            return reds;
          }

          const r5 = (v) => Math.round(v * 100000) / 100000;

          function readRed(rt, label) {
            const reds = readRedRow(rt);
            // `distinct` alone cannot tell a filter that ran from a filter that
            // silently did nothing — a colour matrix that never reached the GPU
            // (or a uAlpha of 0, which makes the fragment early-return the
            // untouched colour) passes the banding assertions unchanged. So
            // also report the value at the quarter point, where the source ramp
            // reads 0.25: brightness at amount -40 must land near 0.15 and
            // contrast near 0.35. Reported, not asserted — run.mjs still gates
            // on `distinct`; this is the evidence a phase records about itself.
            return {
              label,
              distinct: new Set(reds.map((v) => Math.round(v * 100000))).size,
              atQuarter: r5(reds[W >> 2]),
              glError: gl.getError(),
            };
          }

          // Build a 1024-step [0,1] gradient in an rgba16float source texture.
          const VERT = `#version 300 es
precision highp float;
in vec2 aPosition; in vec2 aUV; out vec2 vUV;
uniform mat3 uProjectionMatrix; uniform mat3 uWorldTransformMatrix;
void main(){ mat3 mvp=uProjectionMatrix*uWorldTransformMatrix;
gl_Position=vec4((mvp*vec3(aPosition,1.0)).xy,0.0,1.0); vUV=aUV; }`;
          const FRAG = `#version 300 es
precision highp float; in vec2 vUV; out vec4 finalColor;
void main(){ finalColor=vec4(vUV.x,vUV.x,vUV.x,1.0); }`;

          // A hard step at x = 512, in values 8 bits can hold exactly
          // (0.4 = 102/255, 0.6 = 153/255) so the sharpen ring probe below
          // predicts the same numbers in both pool conditions.
          const STEP_FRAG = `#version 300 es
precision highp float; in vec2 vUV; out vec4 finalColor;
void main(){ float v = vUV.x < 0.5 ? 0.4 : 0.6; finalColor=vec4(v,v,v,1.0); }`;

          // Paint a full-target quad with `fragment` into a fresh f16 texture.
          function paint(fragment) {
            const rt = RenderTexture.create({ width: W, height: H, format: "rgba16float" });
            const mesh = new Mesh({
              geometry: new MeshGeometry({
                positions: new Float32Array([0, 0, W, 0, W, H, 0, H]),
                uvs: new Float32Array([0, 0, 1, 0, 1, 1, 0, 1]),
                indices: new Uint32Array([0, 1, 2, 0, 2, 3]),
              }),
              shader: Shader.from({ gl: { vertex: VERT, fragment }, resources: {} }),
            });
            renderer.render({ container: mesh, target: rt });
            return rt;
          }

          const srcRT = paint(FRAG);
          phase("source", () => readRed(srcRT, "source-f16-gradient"));
          // Kept for the sharpen pass-through probe, which diffs against it.
          const sourceReds = readRedRow(srcRT);

          // Report which format the pool actually allocates.
          phase("poolFormat", () => {
            const t = TexturePool.getOptimalTexture(W, H, 1, false);
            const fmt = t.source.format; TexturePool.returnTexture(t);
            return { filterPoolTextureFormat: fmt };
          });

          // Pass the gradient through a BlurFilter (WeftCut's Tier-A v1 filter).
          const outRT = RenderTexture.create({ width: W, height: H, format: "rgba16float" });
          const stage = new Container();
          const sp = new Sprite(srcRT);
          sp.filters = [new BlurFilter({ strength: 2 })];
          stage.addChild(sp);
          renderer.render({ container: stage, target: outRT });
          phase("blur", () => readRed(outRT, "blur-strength2"));

          // Chromakey pass-through: gray gradient vs green key → alpha 1
          // everywhere, output == input, so the same distinct-count math
          // applies. Loads the REAL product shader sources (the sources file
          // is type-annotation-free JS by contract; a unit test replays this
          // exact loading path).
          const fsMod = require("fs");
          const pathMod = require("path");
          const srcText = fsMod
            .readFileSync(pathMod.resolve(__dirname, "../../src/renderer/render/effects/filters/chromaKeySources.ts"), "utf8")
            .replace(/^export /gm, "");
          const S = new Function(srcText + "\nreturn { CHROMA_FRAG_GL, CHROMA_UNIFORM_DEFAULTS };")();
          const { Filter, GlProgram, UniformGroup, defaultFilterVert } = PIXI;
          const cd = S.CHROMA_UNIFORM_DEFAULTS;
          const chromaFilter = new Filter({
            glProgram: GlProgram.from({ vertex: defaultFilterVert, fragment: S.CHROMA_FRAG_GL, name: "chromakey-gate" }),
            resources: {
              chromaUniforms: new UniformGroup({
                uKey: { value: new Float32Array(cd.uKey), type: "vec3<f32>" },
                uBalance: { value: cd.uBalance, type: "f32" },
                uClipBlack: { value: cd.uClipBlack, type: "f32" },
                uClipWhite: { value: cd.uClipWhite, type: "f32" },
                uDespill: { value: cd.uDespill, type: "f32" },
                uFeather: { value: cd.uFeather, type: "f32" },
                uShrink: { value: cd.uShrink, type: "f32" },
                uViewMatte: { value: cd.uViewMatte, type: "f32" },
              }),
            },
          });
          const chromaRT = RenderTexture.create({ width: W, height: H, format: "rgba16float" });
          const chromaStage = new Container();
          const chromaSp = new Sprite(srcRT);
          chromaSp.filters = [chromaFilter];
          chromaStage.addChild(chromaSp);
          renderer.render({ container: chromaStage, target: chromaRT });
          phase("chroma", () => readRed(chromaRT, "chroma-passthrough"));

          // The colour trio (brightness / contrast / saturation), each a stock
          // ColorMatrixFilter driven by a NON-NEUTRAL amount of -40. A gain
          // BELOW 1 is deliberate: above 1 the ramp would run past 1.0 and the
          // 8-bit intermediate would clamp it, which looks like banding for the
          // wrong reason.
          //
          // The matrices are spelled out here rather than loaded from
          // colorMatrices.ts the way the chroma sources are: that module is
          // ordinary annotated TypeScript (the shader sources are
          // plain-JS-by-contract because they are string constants), and what
          // this phase measures is the POOL the filter's output lands in, not
          // whether the matrix is right. Matrix correctness — the Rec.709
          // saturation included — is owned by colorMatrices.test.ts, which runs
          // in CI where this gate cannot.
          const colorMatrixPhase = (name, matrix) => {
            const f = new ColorMatrixFilter();
            const live = f.matrix; // getter: the live uniform array (never the setter)
            for (let i = 0; i < 20; i++) live[i] = matrix[i];
            const rt = RenderTexture.create({ width: W, height: H, format: "rgba16float" });
            const st = new Container();
            const spr = new Sprite(srcRT);
            spr.filters = [f];
            st.addChild(spr);
            renderer.render({ container: st, target: rt });
            phase(name, () => readRed(rt, `${name}-amount-minus40`));
          };

          // amount -40 → g = 0.6, a plain diagonal gain.
          colorMatrixPhase("brightness", [
            0.6, 0, 0, 0, 0,
            0, 0.6, 0, 0, 0,
            0, 0, 0.6, 0, 0,
            0, 0, 0, 1, 0,
          ]);
          // amount -40 → c = 0.6 pivoted at 0.5, offset 0.5*(1-c) = 0.2.
          colorMatrixPhase("contrast", [
            0.6, 0, 0, 0, 0.2,
            0, 0.6, 0, 0, 0.2,
            0, 0, 0.6, 0, 0.2,
            0, 0, 0, 1, 0,
          ]);
          // amount -40 → s = 0.6, k = 0.4 on Rec.709 weights. Note this one is
          // value-preserving on THIS source by construction: the gradient is
          // neutral grey and the luma weights sum to 1, so the phase reads like
          // the chroma pass-through above. That is the honest reading — a
          // desaturation cannot move a grey ramp, and the gate's job here is
          // the pool, not the grade.
          colorMatrixPhase("saturation", [
            0.68504, 0.28608, 0.02888, 0, 0,
            0.08504, 0.88608, 0.02888, 0, 0,
            0.08504, 0.28608, 0.62888, 0, 0,
            0, 0, 0, 1, 0,
          ]);

          // Sharpen — the catalog's second custom shader, loaded from the REAL
          // product source exactly as chroma is above (both files are
          // type-annotation-free JS by contract, and a unit test replays this
          // loading path). Unlike the colour trio, here the shared source is
          // the point: the maths is the shader.
          const sharpenText = fsMod
            .readFileSync(pathMod.resolve(__dirname, "../../src/renderer/render/effects/filters/sharpenSources.ts"), "utf8")
            .replace(/^export /gm, "");
          const SH = new Function(sharpenText + "\nreturn { SHARPEN_FRAG_GL, SHARPEN_UNIFORM_DEFAULTS };")();
          // uAmount carries the catalog's PERCENTAGE — the shader owns the /100,
          // which is why the gate can drive the same number the slider shows.
          const sharpenFilter = (amount) => new Filter({
            glProgram: GlProgram.from({ vertex: defaultFilterVert, fragment: SH.SHARPEN_FRAG_GL, name: "sharpen-gate" }),
            resources: {
              sharpenUniforms: new UniformGroup({
                uAmount: { value: amount, type: "f32" },
              }),
            },
          });
          const throughSharpen = (sourceRT, amount) => {
            const rt = RenderTexture.create({ width: W, height: H, format: "rgba16float" });
            const st = new Container();
            const spr = new Sprite(sourceRT);
            spr.filters = [sharpenFilter(amount)];
            st.addChild(spr);
            renderer.render({ container: st, target: rt });
            return rt;
          };

          // A substantial amount, not a token one: at 60 the ring probe below
          // predicts a ±0.12 excursion, which no broken kernel lands on.
          const SHARPEN_AMOUNT = 60;
          const r8 = (v) => Math.round(v * 1e8) / 1e8;

          // The same filter at amount 0 — the kernel's own control. It travels
          // the identical pool path (sprite → pool intermediate → f16 target),
          // so diffing the amount-60 row against THIS row, rather than against
          // the source, isolates what the kernel did from what the pool did.
          const sharpenZeroReds = readRedRow(throughSharpen(srcRT, 0));
          const sharpenRT = throughSharpen(srcRT, SHARPEN_AMOUNT);

          phase("sharpen", () => {
            const base = readRed(sharpenRT, `sharpen-amount-${SHARPEN_AMOUNT}`);
            const reds = readRedRow(sharpenRT);
            // Interior only: at x = 0 and x = W-1 `uInputClamp` folds the
            // outward tap back onto the centre, which is a one-sided second
            // difference and a real (documented) excursion of amount × one ramp
            // step. Reported separately rather than hidden in the maximum.
            let interior = 0;
            for (let i = 1; i < W - 1; i++) {
              interior = Math.max(interior, Math.abs(reds[i] - sharpenZeroReds[i]));
            }
            return {
              ...base,
              // How far the kernel moved the ramp away from its own
              // pass-through. On an 8-bit pool intermediate the input is a
              // 256-step staircase and a high-pass amplifies every step by
              // amount: 0.6/255 = 0.00235. On an f16 pool the ramp is smooth,
              // the second derivative vanishes and the kernel is identity.
              rampMaxDiff: r8(interior),
              edgeDiffs: [r8(reds[0] - sharpenZeroReds[0]), r8(reds[W - 1] - sharpenZeroReds[W - 1])],
            };
          });

          // amount 0 must be an EXACT pass-through — the shader early-returns
          // the untouched texel rather than the unpremultiply/re-premultiply
          // round trip of it. Diffed against the source row instead of
          // eyeballed: in the f16 condition the pool is lossless, so the only
          // honest expectation is a max difference of zero; in the default-pool
          // condition the 8-bit intermediate is the whole difference, bounded by
          // one 8-bit step.
          phase("sharpenZero", () => {
            let maxDiff = 0;
            for (let i = 0; i < W; i++) {
              maxDiff = Math.max(maxDiff, Math.abs(sharpenZeroReds[i] - sourceReds[i]));
            }
            return {
              label: "sharpen-amount-0",
              distinct: new Set(sharpenZeroReds.map((v) => Math.round(v * 100000))).size,
              maxDiffVsSource: r8(maxDiff),
              glError: gl.getError(),
            };
          });

          // The ramp phase above cannot prove the kernel RAN. A 3x3 cross
          // unsharp is exactly identity on a linear gradient — the second
          // derivative of a ramp is zero — which is what makes it a clean pool
          // measurement and a useless no-op detector, and `atQuarter` reads the
          // same 0.25 as the source for the same reason. So feed the same filter
          // a STEP and report the six pixels around it. Hand-checkable at
          // amount 60 (a = 0.6, step 0.4 → 0.6):
          //   x ≤ 510 unchanged 0.4 | x = 511 undershoot 0.4 − 0.6·0.2 = 0.28
          //   x = 512 overshoot 0.6 + 0.6·0.2 = 0.72 | x ≥ 513 unchanged 0.6
          // It is a texel-size proof as well: a tap fed a hand-rolled 200×200
          // texel size would land 5 px away, leaving 511/512 alone and moving
          // 507/517 instead — the ConvolutionFilter defect spec decision 4
          // rejected.
          const stepRT = paint(STEP_FRAG);
          const RING_XS = [509, 510, 511, 512, 513, 514];
          phase("sharpenRing", () => {
            const stepReds = readRedRow(stepRT);
            const reds = readRedRow(throughSharpen(stepRT, SHARPEN_AMOUNT));
            return {
              label: `sharpen-step-amount-${SHARPEN_AMOUNT}`,
              xs: RING_XS,
              sourceWindow: RING_XS.map((x) => r5(stepReds[x])),
              window: RING_XS.map((x) => r5(reds[x])),
              glError: gl.getError(),
            };
          });

          ipcRenderer.send("gate-result", out);
        } catch (err) {
          out.fatal = String((err && err.stack) || err);
          ipcRenderer.send("gate-error", out);
        }
      })();
    </script>
  </body>
</html>
