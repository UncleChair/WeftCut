<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <!-- Glow lower third. Inline `opacity: 1` overrides the CSS's 0 (the JS
       fade-in pre-chunk-2 is gone). `--accent` drives the border + glow
       color via the CSS rules; `box-shadow` is set directly here at the
       baseline pulse value (the sine-wave pulse animation is gone too). -->
  <div id="lt" class="lt"
       style="opacity: 1; --accent: {{color}}; box-shadow: 0 0 24px {{color}};">
    <div id="title" class="title">{{title}}</div>
    <div id="subtitle" class="subtitle">{{subtitle}}</div>
  </div>
</body>
</html>
