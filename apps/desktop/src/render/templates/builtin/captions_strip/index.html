<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <!-- Single-cue captions strip — meant for short on-screen lines (240 chars
       max). For full subtitle tracks use the Subtitle media kind instead;
       this template is for emphasis lines an agent wants placed once.
       Inline `opacity: 1` overrides the CSS's 0 (the JS fade-in pre-chunk-2
       is gone — props are baked at build time and the raster is a single
       final-state frame). -->
  <div id="wrap" class="wrap" style="opacity: 1;">
    <div id="box" class="box" style="background: {{color}};">{{text}}</div>
  </div>
</body>
</html>
