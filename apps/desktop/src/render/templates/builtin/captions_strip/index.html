<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <div id="wrap" class="wrap">
    <div id="box" class="box"></div>
  </div>
  <script>
    // Single-cue captions strip — meant for short on-screen lines (240 chars
    // max). For full subtitle tracks use the Subtitle media kind instead;
    // this template is for emphasis lines an agent wants placed once.
    async function start() {
      while (!window.__props__) {
        await new Promise((r) => setTimeout(r, 5));
      }
      const p = window.__props__;
      document.getElementById('box').textContent = p.text || '';
      const box = document.getElementById('box');
      box.style.background = p.color || 'rgba(0, 0, 0, 0.8)';
      const wrap = document.getElementById('wrap');

      const FADE_DURATION = 0.25;
      function tick() {
        const t = performance.now() / 1000;
        const fade = Math.max(0, Math.min(1, t / FADE_DURATION));
        wrap.style.opacity = fade.toFixed(3);
        requestAnimationFrame(tick);
      }
      tick();

      window.__ready__ = Promise.resolve();
    }
    start();
  </script>
</body>
</html>
