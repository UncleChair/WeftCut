<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <!-- Countdown numeral. Pre-chunk-2 the JS ticked the digit down each
       second; without script execution the raster shows the starting
       value (`seconds` prop) as the static frame. The ring tracks the
       accent color. Multi-frame raster (chunk 2e) would restore the
       animation. -->
  <div class="wrap">
    <div class="disc">
      <div id="ring" class="ring" style="border-color: {{color}};"></div>
      <div id="num" class="num">{{seconds}}</div>
    </div>
  </div>
</body>
</html>
