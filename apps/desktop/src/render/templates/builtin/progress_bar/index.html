<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <div id="label" class="label">
    <span id="label-text"></span>
    <span id="label-pct" class="pct">0%</span>
  </div>
  <div id="frame" class="frame">
    <div id="fill" class="fill"></div>
  </div>
  <script>
    // Animates the fill from 0% to the target percent over the first second,
    // then holds. The numeric readout on the right tracks the eased value
    // so the label stays in sync with the visible bar.
    async function start() {
      while (!window.__props__) {
        await new Promise((r) => setTimeout(r, 5));
      }
      const p = window.__props__;
      const target = Math.max(0, Math.min(100, p.percent ?? 100));
      const color = p.color || '#3ad29f';
      const labelText = p.label || '';
      document.getElementById('fill').style.background = color;
      document.getElementById('label-text').textContent = labelText;

      const FILL_DURATION = 1.0;
      const fill = document.getElementById('fill');
      const pct = document.getElementById('label-pct');
      const label = document.getElementById('label');
      function tick() {
        const t = performance.now() / 1000;
        const u = Math.max(0, Math.min(1, t / FILL_DURATION));
        // Ease-out cubic so the bar slows as it approaches the target.
        const eased = 1 - Math.pow(1 - u, 3);
        const cur = target * eased;
        fill.style.width = cur.toFixed(2) + '%';
        pct.textContent = Math.round(cur) + '%';
        label.style.opacity = Math.min(1, t / 0.25).toFixed(3);
        requestAnimationFrame(tick);
      }
      tick();

      window.__ready__ = Promise.resolve();
    }
    start();
  </script>
</body>
</html>
