<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <!-- Progress bar at its final filled state. Pre-chunk-2 the JS animated
       from 0% up to `percent`; without script execution the raster shows
       the final fill. The percent readout displays `percent` verbatim
       (chunk 2 doesn't ceiling/round — `String(100)` is "100"); values
       like `42.5` will render as "42.5%". Multi-frame raster (chunk 2e)
       would restore the fill-up animation. -->
  <div id="label" class="label" style="opacity: 1;">
    <span id="label-text">{{label}}</span>
    <span id="label-pct" class="pct">{{percent}}%</span>
  </div>
  <div id="frame" class="frame">
    <div id="fill" class="fill"
         style="background: {{color}}; width: {{percent}}%;"></div>
  </div>
</body>
</html>
