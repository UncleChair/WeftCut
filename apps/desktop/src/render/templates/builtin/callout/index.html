<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <!-- Positionable callout: a ring marks the focal point (x_percent, y_percent)
       and a label sits next to it. The pre-chunk-2 JS measured the label and
       clamped it inside the frame so edge-percentages still rendered cleanly;
       without script execution we fall back to a fixed offset (48px right of
       the target, vertically centered on it). For x_percent values near the
       right edge the label may extend offscreen — adjust the percent to pull
       it back in. The CSS's `opacity: 0` initial state is overridden inline
       on both elements; the fade-in animation is gone. -->
  <div id="target" class="target"
       style="left: {{x_percent}}%; top: {{y_percent}}%; opacity: 1;
              border-color: {{color}}; box-shadow: 0 0 18px {{color}};"></div>
  <div id="box" class="box"
       style="left: calc({{x_percent}}% + 48px); top: {{y_percent}}%;
              transform: translateY(-50%); opacity: 1;
              background: {{color}};">{{text}}</div>
</body>
</html>
