<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <!-- Lower third with a colored accent bar on the left. The bar tracks the
       user-supplied color; the text is a fixed light tone for contrast.
       Inline `left: 60px` overrides the CSS's offscreen `-600px` (the JS
       slide-in pre-chunk-2 is gone — raster is the settled end state). -->
  <div id="row" class="row" style="left: 60px;">
    <div id="bar" class="bar" style="background: {{color}};"></div>
    <div class="text">
      <div id="title" class="title">{{title}}</div>
      <div id="subtitle" class="subtitle">{{subtitle}}</div>
    </div>
  </div>
</body>
</html>
