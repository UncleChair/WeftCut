<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <!-- Full-frame title card. Inline overrides put both the background and
       the title block at their final animated state (opacity 1, scale 1).
       Pre-chunk-2 the JS faded the bg up over 0.4s and scaled the card
       from 0.985 → 1.0 over 0.6s; without script execution the raster is
       the settled end frame. Empty `subtitle` default leaves the rule
       and subtitle DOM visible but rendering empty/whitespace text —
       acceptable for chunk 2a; a conditional hide rule needs script. -->
  <div id="bg" class="bg" style="opacity: 1; background: {{color}};"></div>
  <div id="card" class="center" style="opacity: 1; transform: scale(1);">
    <div id="title" class="title">{{title}}</div>
    <div id="rule" class="rule"></div>
    <div id="subtitle" class="subtitle">{{subtitle}}</div>
  </div>
</body>
</html>
