<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <!-- Production slate. The clapper stripes are static; pre-chunk-2 the JS
       faded the white clap-flash overlay out over 0.25s. Without script
       execution the raster shows the clean settled board — the flash
       overlay's CSS already starts at `opacity: 0`, which is the right
       final state. Project / scene / take / camera / director / date come
       in as direct text placeholders. -->
  <div class="bg"></div>
  <div class="frame">
    <div class="clapper">
      <div class="stripe" style="background: #fff"></div>
      <div class="stripe" style="background: #111"></div>
      <div class="stripe" style="background: #fff"></div>
      <div class="stripe" style="background: #111"></div>
      <div class="stripe" style="background: #fff"></div>
      <div class="stripe" style="background: #111"></div>
    </div>
    <div id="project" class="project">{{project}}</div>
    <div class="subhead">Production Slate</div>
    <div class="grid">
      <div class="cell"><span class="key">Scene</span><span id="scene" class="value">{{scene}}</span></div>
      <div class="cell"><span class="key">Take</span><span id="take" class="value">{{take}}</span></div>
      <div class="cell"><span class="key">Camera</span><span id="camera" class="value">{{camera}}</span></div>
      <div class="cell"><span class="key">Director</span><span id="director" class="value">{{director}}</span></div>
      <div class="cell"><span class="key">Date</span><span id="date" class="value">{{date}}</span></div>
    </div>
  </div>
  <div id="flash" class="flash"></div>
</body>
</html>
