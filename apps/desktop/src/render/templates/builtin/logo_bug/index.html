<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>__STYLE__</style>
</head>
<body>
  <!-- Corner-style text watermark — a stopgap until PropSpec supports an
       image type. Inline `opacity: 1` overrides the CSS's 0 (the JS
       fade-in pre-chunk-2 is gone). Text uses the user-supplied accent
       color; the badge backdrop stays neutral. -->
  <div id="badge" class="badge" style="opacity: 1;">
    <div id="text" class="text" style="color: {{color}};">{{text}}</div>
  </div>
</body>
</html>
