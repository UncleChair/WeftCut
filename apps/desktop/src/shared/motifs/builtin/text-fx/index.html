<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face{
    font-family:"Inter";
    src:url("assets/Inter.woff2") format("woff2");
    font-weight:700; font-style:normal; font-display:swap;
  }
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
  /* The full frame is the coordinate system; flex justify/align place the text
     block into one of the 9 ASS-style zones (set per h_align/v_align). */
  #stage{position:absolute;inset:0;display:flex;padding:64px;box-sizing:border-box}
  #box{
    font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight:700; line-height:1.25; max-width:100%;
    padding:0.12em 0.34em; box-sizing:border-box;
  }
  /* Manual line breaks only (split on \n); no auto-wrap — a long line clips at
     the frame edge rather than reflowing. */
  .line{white-space:nowrap; min-height:1.2em}
  /* paint-order keeps the outline (text-stroke) behind the fill, so the karaoke
     gradient fill never eats the outline. */
  .ch{paint-order:stroke fill}
</style></head><body>
  <div id="stage"><div id="box"></div></div>
  <script>
    var stage = document.getElementById("stage");
    var box = document.getElementById("box");

    // Scene state, rebuilt by setup() per distinct props and read by frame(t).
    // Everything here is a pure function of t — no timers, no accumulation.
    var charSpans = [];     // flat, DOM/reading order (left→right, top→bottom)
    var winStart = [];      // per-char karaoke window start fraction [0,1]
    var winEnd = [];        // per-char karaoke window end fraction [0,1]
    var effect = "karaoke";
    var typeSpeed = 20;     // chars/sec (typewriter)
    var loopMode = "once";  // once | loop | pingpong (color-shift)
    var colBase = "#ffffff";
    var colAccent = "#ffcc00";

    motif.define({
      setup: async function (props, ctx) {
        effect = String(props.effect || "karaoke");
        typeSpeed = num(props.type_speed, 20);
        loopMode = String(props.loop || "once");
        colBase = str(props.color, "#ffffff");
        colAccent = str(props.color2, "#ffcc00");
        var fontSize = num(props.font_size, 72);
        var outlineW = num(props.outline_width, 0);
        var outlineC = str(props.outline_color, "#000000");

        // 9-grid placement + per-line horizontal alignment.
        stage.style.justifyContent =
          props.h_align === "left" ? "flex-start"
          : props.h_align === "right" ? "flex-end" : "center";
        stage.style.alignItems =
          props.v_align === "top" ? "flex-start"
          : props.v_align === "middle" ? "center" : "flex-end";
        box.style.textAlign =
          props.h_align === "left" ? "left"
          : props.h_align === "right" ? "right" : "center";

        box.style.fontSize = fontSize + "px";
        box.style.background = str(props.bg_color, "#00000000");

        // Build per-character spans (one per visible glyph) so karaoke can wipe
        // each glyph independently and typewriter can reveal glyph-by-glyph.
        var parsed = parseMarkup(str(props.text, ""));
        box.innerHTML = "";
        charSpans = [];
        var weights = [];
        for (var li = 0; li < parsed.length; li++) {
          var lineEl = document.createElement("div");
          lineEl.className = "line";
          var line = parsed[li];
          for (var ci = 0; ci < line.length; ci++) {
            var sp = document.createElement("span");
            sp.className = "ch";
            sp.textContent = line[ci].ch;
            sp.style.webkitTextStrokeWidth = outlineW + "px";
            sp.style.webkitTextStrokeColor = outlineC;
            lineEl.appendChild(sp);
            charSpans.push(sp);
            weights.push(line[ci].weight);
          }
          box.appendChild(lineEl);
        }

        // Karaoke windows: cumulative weights normalized to fill the whole
        // duration, so the sweep always spans the placed layer regardless of
        // the weight magnitudes (relative-weight semantics).
        var total = 0;
        for (var i = 0; i < weights.length; i++) total += weights[i];
        if (total <= 0) total = 1;
        winStart = []; winEnd = [];
        var acc = 0;
        for (var j = 0; j < weights.length; j++) {
          winStart.push(acc / total);
          acc += weights[j];
          winEnd.push(acc / total);
        }

        // Determinism: force the exact face we render before resolving, so the
        // first capture never paints a fallback (see docs/motifs.md Fonts).
        if (document.fonts && document.fonts.load) {
          await document.fonts.load("700 " + fontSize + 'px "Inter"');
        }
        if (document.fonts && document.fonts.ready) await document.fonts.ready;

        applyFrame(0, ctx);
      },
      frame: function (t, ctx) {
        applyFrame(t, ctx);
      },
    });

    // The single time→pixels function. Idempotent at a fixed t (re-seekable).
    function applyFrame(t, ctx) {
      var dur = ctx && ctx.duration > 0 ? ctx.duration : 1;
      var p = clamp01(t / dur);
      var i, sp;

      if (effect === "typewriter") {
        var revealed = Math.floor(t * typeSpeed);
        for (i = 0; i < charSpans.length; i++) {
          sp = charSpans[i];
          sp.style.visibility = i < revealed ? "visible" : "hidden";
          // plain fill (clear any karaoke gradient state)
          sp.style.backgroundImage = "none";
          sp.style.webkitTextFillColor = colBase;
          sp.style.color = colBase;
        }
        return;
      }

      if (effect === "karaoke") {
        for (i = 0; i < charSpans.length; i++) {
          sp = charSpans[i];
          sp.style.visibility = "visible";
          var span = Math.max(1e-9, winEnd[i] - winStart[i]);
          var frac = clamp01((p - winStart[i]) / span);
          var pct = (frac * 100).toFixed(3) + "%";
          // A hard-edged 2-stop gradient clipped to the glyph: sung (accent) up
          // to `pct`, then unsung (base). The edge advances smoothly within the
          // active glyph → a continuous wipe, not a per-glyph color flip.
          sp.style.backgroundImage =
            "linear-gradient(90deg," + colAccent + " 0%," + colAccent + " " + pct +
            "," + colBase + " " + pct + "," + colBase + " 100%)";
          sp.style.webkitBackgroundClip = "text";
          sp.style.backgroundClip = "text";
          sp.style.webkitTextFillColor = "transparent";
          sp.style.color = "transparent";
        }
        return;
      }

      // color-shift: whole block crossfades base→accent over the duration.
      var col = lerpColor(colBase, colAccent, loopProgress(p, loopMode));
      for (i = 0; i < charSpans.length; i++) {
        sp = charSpans[i];
        sp.style.visibility = "visible";
        sp.style.backgroundImage = "none";
        sp.style.webkitTextFillColor = col;
        sp.style.color = col;
      }
    }

    // --- helpers (pure) ------------------------------------------------------

    // Parse the text into lines of { ch, weight }. `{N}` after a glyph sets that
    // glyph's relative karaoke weight (default 1); `\{` is a literal brace. The
    // markup is stripped for every effect so it never renders literally.
    function parseMarkup(text) {
      var lines = [[]];
      var i = 0;
      while (i < text.length) {
        var c = text.charAt(i);
        if (c === "\\" && text.charAt(i + 1) === "{") {
          lines[lines.length - 1].push({ ch: "{", weight: 1 });
          i += 2; continue;
        }
        if (c === "\n") { lines.push([]); i++; continue; }
        if (c === "{") {
          var j = i + 1, numStr = "";
          while (j < text.length && text.charAt(j) !== "}") { numStr += text.charAt(j); j++; }
          if (j < text.length) {
            var w = parseFloat(numStr);
            var cur = lines[lines.length - 1];
            if (cur.length > 0 && isFinite(w) && w > 0) cur[cur.length - 1].weight = w;
            i = j + 1; continue;
          }
          // no closing brace → fall through, treat `{` as a literal glyph
        }
        lines[lines.length - 1].push({ ch: c, weight: 1 });
        i++;
      }
      return lines;
    }

    function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
    function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
    // 0→1→0 over one unit (there-and-back).
    function triangle(p) { var f = p - Math.floor(p); return 1 - Math.abs(2 * f - 1); }

    // color-shift progress: `once` eases base→accent across the whole clip;
    // `pingpong` eases base→accent→base once; `loop` pulses (3 round-trips).
    function loopProgress(p, mode) {
      if (mode === "pingpong") return easeInOut(triangle(p));
      if (mode === "loop") return easeInOut(triangle(p * 3));
      return easeInOut(clamp01(p));
    }

    function num(v, dflt) { var n = Number(v); return isFinite(n) ? n : dflt; }
    function str(v, dflt) { return v != null ? String(v) : dflt; }

    // Parse #rgb / #rgba / #rrggbb / #rrggbbaa → {r,g,b,a}. Falls back to opaque
    // black on anything unexpected (props are validated upstream, so this is a
    // belt-and-braces guard).
    function parseHex(s) {
      s = String(s || "").trim();
      if (s.charAt(0) !== "#") return { r: 0, g: 0, b: 0, a: 1 };
      var h = s.slice(1);
      if (h.length === 3 || h.length === 4) {
        h = h.split("").map(function (c) { return c + c; }).join("");
      }
      var r = parseInt(h.slice(0, 2), 16) || 0;
      var g = parseInt(h.slice(2, 4), 16) || 0;
      var b = parseInt(h.slice(4, 6), 16) || 0;
      var a = h.length >= 8 ? (parseInt(h.slice(6, 8), 16) || 0) / 255 : 1;
      return { r: r, g: g, b: b, a: a };
    }

    function lerpColor(aHex, bHex, q) {
      var a = parseHex(aHex), b = parseHex(bHex);
      var r = Math.round(a.r + (b.r - a.r) * q);
      var g = Math.round(a.g + (b.g - a.g) * q);
      var bl = Math.round(a.b + (b.b - a.b) * q);
      var al = a.a + (b.a - a.a) * q;
      return "rgba(" + r + "," + g + "," + bl + "," + al.toFixed(4) + ")";
    }
  </script>
</body></html>
