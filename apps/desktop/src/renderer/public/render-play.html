<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>WeftCut — Render & Play</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        flex: 0 0 auto;
        background: rgba(20, 20, 20, 0.95);
        color: #eee;
        padding: 6px 12px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      header .path {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, monospace;
        color: #aaa;
      }
      .video-host {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
      }
      video {
        max-width: 100%;
        max-height: 100%;
        display: block;
      }
      .error {
        color: #f88;
        font-family: ui-monospace, monospace;
        padding: 20px;
        font-size: 13px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="path" id="path-label"></span>
    </header>
    <div class="video-host" id="host"></div>
    <script>
      // URL shape: render-play.html#src=<asset url>&path=<display path>
      const params = new URLSearchParams(window.location.hash.slice(1));
      const src = params.get("src");
      const displayPath = params.get("path") ?? "";
      const host = document.getElementById("host");
      document.getElementById("path-label").textContent = displayPath;
      document.title = `WeftCut — Render & Play — ${displayPath}`;
      if (!src) {
        host.innerHTML =
          '<div class="error">No video source. Open this window via the Pixi Export complete state.</div>';
      } else {
        const v = document.createElement("video");
        v.src = src;
        v.controls = true;
        v.autoplay = true;
        v.addEventListener("error", () => {
          host.innerHTML =
            '<div class="error">Could not load video. Check that the file still exists at the path above.</div>';
        });
        host.appendChild(v);
      }
    </script>
  </body>
</html>
